# Deploy the worker from CI, so shipping never depends on one laptop's toolchain.
#
# This exists because `npx wrangler deploy` broke locally with a workerd platform
# mismatch (wrangler loads the native workerd binary at startup even for a deploy, which
# needs no local runtime at all) — during a live event, with a fix that had to go out.
#
# One-time setup, all doable from a browser:
#   1. Cloudflare dashboard → My Profile → API Tokens → Create Token → use the
#      "Edit Cloudflare Workers" template, scoped to this account.
#   2. GitHub → repo Settings → Secrets and variables → Actions → new secret
#      CLOUDFLARE_API_TOKEN with that token.
# Then: push to master, or hit "Run workflow" on any branch from the Actions tab.
name: Deploy worker

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: deploy-dink-proxy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure CLOUDFLARE_API_TOKEN is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set. Add it in Settings → Secrets → Actions, then re-run."
            exit 1
          fi
      # A clean install on the runner's own platform — the exact thing that was wrong
      # locally. No lockfile is committed, so `npm install` rather than `npm ci`.
      - run: npm install
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
